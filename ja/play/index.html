</head><body class="site-page"><a class="skip-link" href="#main-content">本文へ移動</a><!-- SITE_HEADER --><main class="site-main" id="main-content"><section class="site-hero"><div><p class="site-eyebrow">ブラウザですぐにプレイ</p><h1>Jellyfish Climbを始める</h1><p class="site-hero__lead">ゲーム画面のUIは現在英語ですが、クリック・タップで上昇し、A・Dまたは対応スマートフォンの傾きで方向を決める基本操作は共通です。</p><div class="site-actions"><a class="site-button" href="%ROOT_PATH%play/" data-play-source="play_landing_cta">ゲームを開く</a><a class="site-button site-button--secondary" href="%ROOT_PATH%ja/how-to-play/">日本語の遊び方</a></div></div><div class="site-hero__art" aria-hidden="true"><span class="site-jelly"><span class="site-jelly__pulse"></span><span class="site-jelly__thrust"></span><span class="site-jelly__shine"></span></span></div></section><section class="content-section"><h2>プレイ前の確認</h2><div class="feature-grid"><article class="site-card"><h3>スマートフォン</h3><p>画面をタップして拍動します。傾き操作はHTTPS、端末センサー、ブラウザ権限に依存します。</p></article><article class="site-card"><h3>デスクトップ</h3><p>クリックまたはSpaceで拍動し、A・Dで次の移動方向を決めます。</p></article><article class="site-card"><h3>音量</h3><p>開始前、ポーズ中、リザルト画面からBGMと効果音を個別に調整できます。</p></article></div></section></main><!-- SITE_FOOTER --><script type="module" src="/src/site.ts"></script></body></html>
